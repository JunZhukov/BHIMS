      </div>
    </div>
  </header>

  <main class="page-content">
    <div class="container">
      <div class="page-header">
        <div>
          <h1 class="page-title">Settings</h1>
          <p class="page-subtitle">Manage your account and preferences</p>
        </div>
      </div>

      <div class="settings-card card">
        <div class="settings-item">
          <div class="settings-label">
            <span class="settings-icon">🌙</span>
            <div>
              <strong>Dark Mode</strong>
              <p>Switch to a darker theme for comfortable viewing</p>
            </div>
          </div>
          <label class="theme-toggle">
            <input type="checkbox" id="darkModeToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>
      </div>

      <div class="settings-card card">
        <div class="settings-item settings-logout">
          <div class="settings-label">
            <span class="settings-icon">🚪</span>
            <div>
              <strong>Log Out</strong>
              <p>Sign out of your account</p>
            </div>
          </div>
          <button class="btn btn-primary" id="logoutBtn">Log Out</button>
        </div>
      </div>
    </div>
  </main>

  <div class="confirm-modal" id="logoutModal">
    <div class="confirm-modal-overlay" id="logoutOverlay"></div>
    <div class="confirm-modal-content">
      <h3>Logout</h3>
      <p>Are you sure you want to logout?</p>
      <div class="confirm-modal-actions">
        <button type="button" class="btn btn-outline" id="logoutCancel">Cancel</button>
        <button type="button" class="btn btn-primary" id="logoutConfirmBtn">Logout</button>
      </div>
    </div>
  </div>

  <script src="theme.js"></script>
  <script>
    // Dark mode toggle
    const toggle = document.getElementById('darkModeToggle');
    toggle.checked = document.documentElement.classList.contains('dark-mode');
    toggle.addEventListener('change', () => {
      document.documentElement.classList.toggle('dark-mode', toggle.checked);
      localStorage.setItem('theme', toggle.checked ? 'dark' : 'light');
    });

    // Log out
    document.getElementById('logoutBtn').addEventListener('click', () => {
      document.getElementById('logoutModal').classList.add('active');
    });
    document.getElementById('logoutOverlay').addEventListener('click', () => {
      document.getElementById('logoutModal').classList.remove('active');
    });
    document.getElementById('logoutCancel').addEventListener('click', () => {
      document.getElementById('logoutModal').classList.remove('active');
    });
    document.getElementById('logoutConfirmBtn').addEventListener('click', () => {
      localStorage.removeItem('bhims_logged_in');
      localStorage.removeItem('bhims_user');
      localStorage.removeItem('bhims_role');
      window.location.href = 'login.html';
    });
  </script>
</body>
</html>
